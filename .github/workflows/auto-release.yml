name: Auto Release

# Publishes a GitHub Release automatically whenever the VERSION file changes
# on master.  One job: build printer_agent.exe, then create the release with
# the .exe already attached (created as a draft and published only once the
# asset is uploaded, so agents never see a release without its .exe).
#
# Release notes come from release-notes/<version>.md when that file exists,
# otherwise from the commit message of the version-bump commit.
#
# Releases created here use the built-in GITHUB_TOKEN, which by design does
# NOT trigger other workflows — so build-agent-exe.yml does not double-build.
# That workflow remains for manually created releases and manual rebuilds.

on:
  push:
    branches: [master]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Read VERSION and check for an existing release
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify agent version matches VERSION
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          grep -q "AGENT_VERSION = \"$tag\"" agent/printer_agent.py || {
            echo "::error::AGENT_VERSION in agent/printer_agent.py does not match VERSION ($tag)"; exit 1; }

      - name: Set up Python 3.12
        if: steps.ver.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        if: steps.ver.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "pysnmp>=6.2" requests

      - name: Build printer_agent.exe
        if: steps.ver.outputs.exists == 'false'
        run: |
          pyinstaller --onefile --name printer_agent `
            --collect-all pysnmp `
            --hidden-import pysnmp.smi.mibs `
            --hidden-import pysnmp.smi.mibs.instances `
            --hidden-import pyasn1 `
            --hidden-import pyasn1.codec.ber `
            --hidden-import pyasn1.codec.der `
            agent/printer_agent.py

      - name: Create the release (draft -> attach exe -> publish)
        if: steps.ver.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          notes="release-notes/$tag.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            git log -1 --pretty=%B > "$notes"
          fi
          title="$(git log -1 --pretty=%s)"
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "$title" --notes-file "$notes"
          gh release upload "$tag" dist/printer_agent.exe --clobber
          gh release edit "$tag" --draft=false --latest
